<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brújula · Lo importante. Claro. Breve.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0D1B2A;
  --accent: #3B82F6;
  --accent-light: #DBEAFE;
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --border: #E2E8F0;
  --text: #1F2937;
  --text-2: #6B7280;
  --text-3: #9CA3AF;
  --green: #059669;
  --green-light: #D1FAE5;
  --amber: #D97706;
  --amber-light: #FEF3C7;
  --red: #DC2626;
  --purple: #7C3AED;
  --purple-light: #EDE9FE;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
}

[data-theme="dark"] {
  --navy: #E2E8F0;
  --accent: #60A5FA;
  --accent-light: #1E3A8A22;
  --bg: #0F172A;
  --surface: #1E293B;
  --border: #334155;
  --text: #F1F5F9;
  --text-2: #94A3B8;
  --text-3: #64748B;
  --green-light: #05966920;
  --amber-light: #D9770620;
  --purple-light: #7C3AED20;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; transition: background 0.3s, color 0.3s; }

/* ── TOPBAR ── */
.topbar { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); padding: 0 20px; height: 48px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(12px); background: rgba(255,255,255,0.95); transition: background 0.3s, border-color 0.3s; gap: 16px; }
[data-theme="dark"] .topbar { background: rgba(15,23,42,0.95); }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; flex-shrink: 0; }
.logo-icon { width: 24px; height: 24px; }
.logo-name { font-family: 'DM Serif Display', Georgia, serif; font-size: 18px; color: var(--navy); letter-spacing: -0.3px; transition: color 0.3s; }
.logo-date { font-size: 12px; color: var(--text-3); font-weight: 400; padding-left: 12px; border-left: 1px solid var(--border); margin-left: 4px; white-space: nowrap; }

/* Buscador en topbar */
.topbar-search { flex: 1; max-width: 480px; }
.topbar-search form { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 99px; padding: 5px 6px 5px 14px; gap: 8px; transition: border-color 0.2s, box-shadow 0.2s; }
.topbar-search form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.topbar-search svg { color: var(--text-3); width: 15px; height: 15px; flex-shrink: 0; }
.topbar-search input { flex: 1; border: none; outline: none; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--text); background: transparent; }
.topbar-search input::placeholder { color: var(--text-3); }
.topbar-search button { background: var(--accent); color: #fff; border: none; padding: 5px 14px; border-radius: 99px; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
.topbar-search button:hover { background: #2563EB; }

.topbar-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.tb-btn { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border: none; background: transparent; color: var(--text-2); font-size: 12px; font-family: 'DM Sans', sans-serif; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s, color 0.15s; }
.tb-btn:hover { background: var(--bg); color: var(--text); }
.tb-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

/* ── BUSCADOR (hero eliminado, buscador movido al topbar) ── */
.search-wrap { display: none; }

/* ── NAV TABS ── */
.nav-tabs { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; overflow-x: auto; scrollbar-width: none; transition: background 0.3s; }
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab { padding: 10px 14px; font-size: 13px; font-weight: 500; color: var(--text-2); border: none; background: transparent; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: 'DM Sans', sans-serif; transition: color 0.15s, border-color 0.15s; }
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── LAYOUT PRINCIPAL ── */
.main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 40px; }
.feed { min-width: 0; max-width: 1400px; }
.sidebar { display: flex; flex-direction: column; gap: 14px; }

/* ── SECTION HEAD ── */
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ''; display: inline-block; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
.badge-live { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: var(--red); background: #FEE2E2; padding: 2px 8px; border-radius: 99px; }
.badge-live::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── GRID 3 COLUMNAS ── */
.news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

/* ── TARJETA ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s; display: flex; flex-direction: column; }
.card:hover { box-shadow: var(--shadow-md); border-color: #CBD5E1; transform: translateY(-2px); }

/* LÍNEA DE COLOR IZQUIERDA (reemplaza el placeholder con fondo) */
.card-accent-bar { width: 100%; height: 3px; flex-shrink: 0; }

.card-body { padding: 12px 14px 14px; flex: 1; display: flex; flex-direction: column; }
.card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }

/* CATEGORÍA: solo texto con línea izquierda, sin recuadro de color */
.card-cat { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; display: flex; align-items: center; gap: 6px; }
.card-cat::before { content: ''; display: inline-block; width: 3px; height: 12px; border-radius: 2px; flex-shrink: 0; }
.cat-economia { color: var(--amber); }
.cat-economia::before { background: var(--amber); }
.cat-salud { color: var(--green); }
.cat-salud::before { background: var(--green); }
.cat-tecnologia { color: #1D4ED8; }
.cat-tecnologia::before { background: #1D4ED8; }
.cat-mundo { color: var(--purple); }
.cat-mundo::before { background: var(--purple); }
.cat-argentina { color: var(--red); }
.cat-argentina::before { background: var(--red); }
.cat-ciencia { color: #15803D; }
.cat-ciencia::before { background: #15803D; }
.cat-deportes { color: #C2410C; }
.cat-deportes::before { background: #C2410C; }
.cat-cultura { color: #9333EA; }
.cat-cultura::before { background: #9333EA; }

.card-time { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 3px; }
.card-time svg { width: 11px; height: 11px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 7px; flex: 1; transition: color 0.15s; }
.card:hover .card-title { color: var(--accent); }
.card-why { font-size: 11px; color: var(--text-2); line-height: 1.5; margin-bottom: 10px; padding: 7px 9px; background: var(--bg); border-radius: 6px; border-left: 2px solid var(--accent); transition: background 0.3s; }
.card-why-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); display: block; margin-bottom: 2px; }
.card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.card-source { font-size: 11px; color: var(--text-3); }
.card-expand { display: flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-light); border: none; padding: 4px 10px; border-radius: 99px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
.card-expand:hover { background: #BFDBFE; }
.card-expand svg { width: 11px; height: 11px; }

/* ── EXPANDIDA ── */
.card.expanded { grid-column: 1 / -1; cursor: default; }
.card.expanded:hover { transform: none; box-shadow: none; }
.expanded-bar { width: 100%; height: 4px; }
.expanded-body { padding: 20px 24px; }
.expanded-title { font-family: 'DM Serif Display', Georgia, serif; font-size: 20px; color: var(--text); line-height: 1.3; margin-bottom: 16px; }
.expanded-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.expanded-block { background: var(--bg); border-radius: var(--radius-sm); padding: 11px 13px; border: 1px solid var(--border); }
.expanded-block-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; }
.expanded-block-text { font-size: 12px; color: var(--text); line-height: 1.55; }
.expanded-sources { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.expanded-source-tag { font-size: 11px; color: var(--text-2); background: var(--bg); border: 1px solid var(--border); padding: 2px 9px; border-radius: 99px; }
.expanded-footer { display: flex; align-items: center; justify-content: space-between; }
.card-close { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--text-2); background: var(--bg); border: 1px solid var(--border); padding: 6px 14px; border-radius: 99px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
.card-close:hover { background: var(--border); }
.card-close svg { width: 13px; height: 13px; }

/* ── LOAD MORE ── */
.load-more { display: flex; justify-content: center; margin-top: 20px; }
.load-btn { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--accent); background: var(--surface); border: 1px solid var(--border); padding: 9px 22px; border-radius: 99px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s, border-color 0.15s; }
.load-btn:hover { background: var(--accent-light); border-color: var(--accent); }

/* ── SIDEBAR ── */
.sb-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; transition: background 0.3s; }
.sb-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-2); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.sb-title svg { width: 13px; height: 13px; }

/* ── DATO CURIOSO — compact ── */
.curiosity-block { background: linear-gradient(135deg, #4C1D95, #4338CA); border-radius: var(--radius); padding: 12px 14px; }
.curiosity-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.curiosity-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #C4B5FD; display: flex; align-items: center; gap: 5px; }
.curiosity-cat-badge { font-size: 10px; color: #A78BFA; }
.curiosity-text { font-size: 12px; color: #EDE9FE; line-height: 1.55; }
.curiosity-refresh { background: rgba(255,255,255,0.15); border: none; border-radius: 99px; padding: 4px 7px; cursor: pointer; display: flex; align-items: center; color: #EDE9FE; transition: background 0.15s; flex-shrink: 0; }
.curiosity-refresh:hover { background: rgba(255,255,255,0.28); }
.curiosity-refresh svg { width: 13px; height: 13px; }

/* ── QUÉ ME PERDÍ ── */
.missed-item { display: flex; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.missed-item:last-child { border-bottom: none; padding-bottom: 0; }
.missed-item:first-child { padding-top: 0; }
.missed-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.missed-text { font-size: 11px; color: var(--text); line-height: 1.4; }
.missed-meta { font-size: 10px; color: var(--text-3); margin-top: 1px; }

/* ── TENDENCIAS ── */
.trend-item { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.trend-item:last-child { border-bottom: none; }
.trend-item:first-child { padding-top: 0; }
.trend-num { font-size: 11px; font-weight: 600; color: var(--text-3); font-family: 'DM Mono', monospace; min-width: 18px; }
.trend-text { font-size: 12px; color: var(--text); flex: 1; line-height: 1.35; }
.trend-text:hover { color: var(--accent); }
.trend-count { font-size: 10px; color: var(--text-3); }

/* ── FOOTER ── */
.footer { border-top: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
.footer-brand { font-family: 'DM Serif Display', Georgia, serif; font-size: 14px; color: var(--text-2); }
.footer-brand span { color: var(--accent); }
.footer-links { display: flex; gap: 18px; }
.footer-link { font-size: 11px; color: var(--text-3); cursor: pointer; text-decoration: none; transition: color 0.15s; }
.footer-link:hover { color: var(--text); }
.footer-update { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
.update-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 2s infinite; }

@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.card { animation: fadeUp 0.25s ease both; }
.card:nth-child(1){animation-delay:.04s} .card:nth-child(2){animation-delay:.07s} .card:nth-child(3){animation-delay:.10s}
.card:nth-child(4){animation-delay:.13s} .card:nth-child(5){animation-delay:.16s} .card:nth-child(6){animation-delay:.19s}
.card:nth-child(7){animation-delay:.22s} .card:nth-child(8){animation-delay:.25s} .card:nth-child(9){animation-delay:.28s}

@media (max-width:1100px){ .main{grid-template-columns:1fr} .sidebar{display:none} }
@media (max-width:800px){ .news-grid{grid-template-columns:1fr 1fr} }
@media (max-width:540px){ .news-grid{grid-template-columns:1fr} .hero-title{font-size:24px} .main{padding:14px} }
</style>
</head>

// ── RENDER NOTICIAS ──
let expandedId = null;

function renderNews(data) {
  const grid = document.getElementById('newsGrid');
  grid.innerHTML = '';
  data.forEach(n => {
    const card = document.createElement('article');
    card.className = 'card';
    card.id = n.id;
    card.innerHTML = cardHTML(n);
    grid.appendChild(card);
  });
}

function cardHTML(n) {
  return `
    <div class="card-accent-bar" style="background:${n.color}"></div>
    <div class="card-body">
      <div class="card-top">
        <span class="card-cat cat-${n.cat}">${n.catLabel}</span>
        <span class="card-time">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          ${n.time}
        </span>
      </div>
      <h2 class="card-title">${n.title}</h2>
      <div class="card-why">
        <span class="card-why-label">¿Por qué importa?</span>
        ${n.why}
      </div>
      <div class="card-footer">
        <span class="card-source">${n.source} · ${n.sourceTime}</span>
        <button class="card-expand" onclick="expandCard('${n.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
          + Ampliar
        </button>
      </div>
    </div>`;
}

function expandCard(id) {
  if (expandedId === id) { collapseCard(id); return; }
  if (expandedId) collapseCard(expandedId);

  const n = newsData.find(x => x.id === id);
  const card = document.getElementById(id);
  if (!n || !card) return;

  expandedId = id;
  card.classList.add('expanded');
  card.innerHTML = `
    <div class="expanded-bar" style="background:${n.color}"></div>
    <div class="expanded-body">
      <div class="card-top" style="margin-bottom:12px">
        <span class="card-cat cat-${n.cat}">${n.catLabel}</span>
        <span class="card-time">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          ${n.time}
        </span>
      </div>
      <h2 class="expanded-title">${n.title}</h2>
      <div class="expanded-grid">
        <div class="expanded-block">
          <div class="expanded-block-label" style="color:${n.color}">Resumen ampliado</div>
          <p class="expanded-block-text">${n.resumen}</p>
        </div>
        <div class="expanded-block">
          <div class="expanded-block-label" style="color:#7C3AED">Contexto</div>
          <p class="expanded-block-text">${n.contexto}</p>
        </div>
        <div class="expanded-block">
          <div class="expanded-block-label" style="color:#D97706">Impacto esperado</div>
          <p class="expanded-block-text">${n.impacto}</p>
        </div>
        <div class="expanded-block">
          <div class="expanded-block-label" style="color:#059669">¿Qué cambia?</div>
          <p class="expanded-block-text">${n.cambia}</p>
        </div>
      </div>
      <div style="margin-bottom:12px">
        <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-2);margin-bottom:7px">Fuentes</div>
        <div class="expanded-sources">${n.fuentes.map(f=>`<span class="expanded-source-tag">${f}</span>`).join('')}</div>
      </div>
      <div class="expanded-footer">
        <button class="card-close" onclick="collapseCard('${id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          Cerrar
        </button>
        <div style="display:flex;gap:7px">
          <button style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--text-2);background:var(--bg);border:1px solid var(--border);padding:5px 12px;border-radius:99px;cursor:pointer;font-family:'DM Sans',sans-serif;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Guardar
          </button>
          <button style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-light);border:none;padding:5px 12px;border-radius:99px;cursor:pointer;font-family:'DM Sans',sans-serif;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>Compartir
          </button>
        </div>
      </div>
    </div>`;
  setTimeout(() => card.scrollIntoView({ behavior:'smooth', block:'start' }), 80);
}

function collapseCard(id) {
  const n = newsData.find(x => x.id === id);
  const card = document.getElementById(id);
  if (!n || !card) return;
  card.classList.remove('expanded');
  card.innerHTML = cardHTML(n);
  expandedId = null;
}

// ── DARK MODE ──
function toggleTheme() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? '' : 'dark');
  document.getElementById('themeIcon').innerHTML = dark
    ? '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'
    : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
}

function setTab(el) {
  // Activar tab
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');

  activeFilter = el.dataset.cat;

  // Cerrar card expandida si hay una abierta
  if (expandedId) collapseCard(expandedId);

  // Filtrar noticias
  const filtradas = activeFilter === 'all' || activeFilter === 'semana'
    ? newsData
    : newsData.filter(n => n.cat === activeFilter);

  // Actualizar título de sección
  const titulo = document.querySelector('.section-title');
  const labels = {
    all: 'Noticias del día', semana: 'Esta semana',
    argentina: 'Argentina', mundo: 'Mundo',
    economia: 'Economía', tecnologia: 'Tecnología',
    ciencia: 'Ciencia', salud: 'Salud',
    cultura: 'Cultura', deportes: 'Deportes'
  };
  titulo.textContent = labels[activeFilter] || 'Noticias';

  // Renderizar con animación
  const grid = document.getElementById('newsGrid');
  grid.style.opacity = '0';
  grid.style.transform = 'translateY(6px)';
  grid.style.transition = 'opacity 0.18s, transform 0.18s';

  setTimeout(() => {
    if (filtradas.length === 0) {
      grid.innerHTML = `
        <div style="grid-column:1/-1; text-align:center; padding:48px 24px; color:var(--text-3);">
          <div style="font-size:32px; margin-bottom:10px;">📭</div>
          <div style="font-size:14px; font-weight:500; color:var(--text-2); margin-bottom:6px;">Sin noticias en esta categoría</div>
          <div style="font-size:13px;">Importá un JSON actualizado para ver contenido aquí.</div>
        </div>`;
    } else {
      renderNews(filtradas);
    }
    grid.style.opacity = '1';
    grid.style.transform = 'translateY(0)';
  }, 120);

  // Actualizar contador
  const badge = document.getElementById('fechaBadge');
  if (badge) {
    if (activeFilter !== 'all' && activeFilter !== 'semana') {
      badge.textContent = filtradas.length === 0
        ? 'sin resultados'
        : `${filtradas.length} ${filtradas.length === 1 ? 'noticia' : 'noticias'}`;
    } else {
      // Restaurar fecha
      const ahora = new Date();
      const dias = ['dom','lun','mar','mié','jue','vie','sáb'];
      badge.textContent = `${dias[ahora.getDay()]} ${ahora.getDate()}/${String(ahora.getMonth()+1).padStart(2,'0')}`;
    }
  }
}

// ── BÚSQUEDA ──
function doSearch(e) {
  e.preventDefault();
  const q = document.getElementById('searchInput').value.trim();
  if (q) window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
}
function quickSearch(q) {
  document.getElementById('searchInput').value = q;
  window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
}

// ── FECHAS Y HORA ──
function setFechas() {
  const ahora = new Date();
  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  const diaNombre = dias[ahora.getDay()];
  const diaNum    = ahora.getDate();
  const mes       = meses[ahora.getMonth()];
  const anio      = ahora.getFullYear();
  const horas     = String(ahora.getHours()).padStart(2,'0');
  const minutos   = String(ahora.getMinutes()).padStart(2,'0');
  const mesNum    = String(ahora.getMonth()+1).padStart(2,'0');
  const diaCorto  = diaNombre.slice(0,3);

  // Topbar: "miércoles 25 de junio de 2026"
  const topbarEl = document.getElementById('topbarFecha');
  if (topbarEl) topbarEl.textContent = `${diaNombre} ${diaNum} de ${mes} de ${anio}`;

  // Badge junto a "Noticias del día"
  const fechaBadge = document.getElementById('fechaBadge');
  if (fechaBadge) fechaBadge.textContent = `${diaCorto} ${diaNum}/${mesNum}`;

  // Footer
  const footerEl = document.getElementById('footerUpdate');
  if (footerEl) footerEl.textContent = `Actualizado hoy · ${horas}:${minutos}`;
}

// ── INIT ──
renderNews(newsData);
setFechas();
